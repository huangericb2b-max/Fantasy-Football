[project]
name = "ffedge"
version = "0.1.0"
description = "Fantasy football analysis engine: usage, regression, whiteboard matchups and projections from nflverse data"
requires-python = ">=3.10"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ffedge = "ffedge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ffedge*"]

[tool.pytest.ini_options]
markers = ["network: needs to download nflverse data"]
